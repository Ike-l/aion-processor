[package]
name = "aion-processor"
version = "0.1.0"
edition = "2024"

[dependencies]
aion-program = { path = "../aion-program" }
aion-system = { path = "../aion-system" }


execution-graph = { path = "../execution_graph" }


tokio = { version = "1.52.1", features = [ "rt", "rt-multi-thread" ] }
threadpool = "1.8.1"
parking_lot = { version = "0.12.5", features = ["arc_lock"] }